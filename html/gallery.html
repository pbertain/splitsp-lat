<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>splitsp.lat &middot; gallery</title>
        <link rel="stylesheet" href="css/main.css">
        <style>
            #search {
                font-size: 18px;
                padding: 6px 10px;
                border-radius: 12px;
                border: 2px solid #2196F3;
                background: #1B1044;
                color: #F7F6F6;
                width: 300px;
                margin-bottom: 20px;
            }
            #count {
                color: #C6C4C4;
                font-size: 14px;
            }
            #grid {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 16px;
                max-width: 1100px;
                margin: 0 auto;
            }
            .card {
                border: 2px solid #8A3FFB;
                border-radius: 16px;
                padding: 10px;
                width: 180px;
                background: #24124f;
            }
            .card img {
                max-width: 100%;
                max-height: 120px;
                border-radius: 8px;
            }
            .card p {
                word-break: break-all;
                font-size: 12px;
                color: #F2A6DE;
            }
        </style>
    </head>
    <body class="body_main">
      <center>
        <img src="images/logo.svg" alt="splitsp.lat logo" width="240">
        <h1 class="header">Logo &amp; image gallery</h1>
        <input type="text" id="search" placeholder="Search by filename...">
        <div id="count"></div>
        <div id="grid"></div>
        <p class="footer"><a href="index.html">&larr; back to splitsp.lat</a></p>
      </center>
      <script>
        fetch('manifest.json')
          .then(function (r) { return r.json(); })
          .then(function (items) {
            var grid = document.getElementById('grid');
            var count = document.getElementById('count');
            var search = document.getElementById('search');

            function render(list) {
              grid.innerHTML = '';
              list.forEach(function (item) {
                var card = document.createElement('div');
                card.className = 'card';
                var img = document.createElement('img');
                img.src = item.path;
                img.alt = item.name;
                img.loading = 'lazy';
                var label = document.createElement('p');
                label.textContent = item.name;
                card.appendChild(img);
                card.appendChild(label);
                grid.appendChild(card);
              });
              count.textContent = list.length + ' item(s)';
            }

            render(items);

            search.addEventListener('input', function () {
              var q = search.value.toLowerCase();
              render(items.filter(function (item) {
                return item.name.toLowerCase().indexOf(q) !== -1 ||
                       item.category.toLowerCase().indexOf(q) !== -1;
              }));
            });
          });
      </script>
    </body>
</html>
