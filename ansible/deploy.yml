---
- name: Deploy splitsp.lat static site
  hosts: "{{ target | default('dev') }}"
  gather_facts: false

  tasks:
    - name: Ensure deploy directory exists
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Sync site content
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../html/"
        dest: "{{ deploy_dir }}/"
        delete: true
        rsync_opts:
          - "--exclude=.DS_Store"

    - name: Deploy nginx site config
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../config/{{ config_env }}/nginx/sites-available/41-splitsp-lat-nginx.conf"
        dest: /etc/nginx/sites-available/41-splitsp-lat-nginx.conf
        mode: "0644"

    - name: Deploy apache2 site config
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../config/{{ config_env }}/apache2/sites-available/41-splitsp-lat-apache2.conf"
        dest: /etc/apache2/sites-available/41-splitsp-lat-apache2.conf
        mode: "0644"

    - name: Enable nginx site
      become: true
      ansible.builtin.file:
        src: ../sites-available/41-splitsp-lat-nginx.conf
        dest: /etc/nginx/sites-enabled/41-splitsp-lat-nginx.conf
        state: link
        force: true

    - name: Enable apache2 site
      become: true
      ansible.builtin.file:
        src: ../sites-available/41-splitsp-lat-apache2.conf
        dest: /etc/apache2/sites-enabled/41-splitsp-lat-apache2.conf
        state: link
        force: true

    - name: Test nginx configuration
      become: true
      ansible.builtin.command: nginx -t
      changed_when: false
      check_mode: false

    - name: Test apache2 configuration
      become: true
      ansible.builtin.command: apache2ctl configtest
      changed_when: false
      check_mode: false

    - name: Reload nginx
      become: true
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    - name: Reload apache2
      become: true
      ansible.builtin.systemd:
        name: apache2
        state: reloaded
